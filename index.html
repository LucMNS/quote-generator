<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quote of the day</title>
</head>
<body>
    
<div class="quote-box">
    <h2>Citação do dia</h2>
    <blockquote id="quote">Carregando...</blockquote>
    <span id="author">Carregando...</span>
    <label class="language-control" for="quote-language">
        Idioma da citação
        <select id="quote-language">
            <option value="pt">Português (tradução automática)</option>
            <option value="en">Inglês (original)</option>
        </select>
    </label>
    <div>
        <button id="new-quote" type="button">Nova citação</button>
        <button id="share-x" type="button"><span class="x-logo" aria-hidden="true">𝕏</span> Compartilhar no X</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
